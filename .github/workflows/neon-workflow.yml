name: Create/Delete Neon Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    steps:
      - name: Get PR head branch name
        id: branch_name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "current_branch=${HEAD_REF}" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch & Run Safe Migration
    needs: setup
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' && (
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize') &&
      github.head_ref != 'main' &&
      github.head_ref != 'production'
    runs-on: ubuntu-latest
    outputs:
      branch_id: ${{ steps.create_neon_branch.outputs.branch_id }}
      created: ${{ steps.create_neon_branch.outputs.created }}
      db_host: ${{ steps.create_neon_branch.outputs.db_host }}
      db_host_pooled: ${{ steps.create_neon_branch.outputs.db_host_pooled }}
    steps:
      - name: Set 14-day branch expiration timestamp (RFC 3339 UTC)
        id: expiration
        run: echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiration.outputs.expires_at }}

      - name: Mask connection credentials and log non-sensitive metadata
        env:
          DB_PASSWORD: ${{ steps.create_neon_branch.outputs.password }}
          DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          BRANCH_ID: ${{ steps.create_neon_branch.outputs.branch_id }}
          BRANCH_CREATED: ${{ steps.create_neon_branch.outputs.created }}
          EXPIRES_AT: ${{ steps.expiration.outputs.expires_at }}
        run: |
          if [ -n "${DB_PASSWORD}" ]; then echo "::add-mask::${DB_PASSWORD}"; fi
          if [ -n "${DB_URL}" ]; then echo "::add-mask::${DB_URL}"; fi
          if [ -n "${DB_URL_POOLED}" ]; then echo "::add-mask::${DB_URL_POOLED}"; fi
          echo "Neon branch ready: id=${BRANCH_ID}, created=${BRANCH_CREATED}, expires_at=${EXPIRES_AT}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run safe PostgreSQL ledger migration and security audit on preview branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' && (
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize') &&
          github.head_ref != 'main' &&
          github.head_ref != 'production' &&
          startsWith(format('preview/pr-{0}-{1}', github.event.number, needs.setup.outputs.branch), 'preview/pr-')
        env:
          MIGRATION_DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          ORACLE_APP_PASSWORD: ${{ secrets.ORACLE_APP_PASSWORD }}
          EXPECTED_NEON_BRANCH: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          EXPECTED_NEON_BRANCH_ID: ${{ steps.create_neon_branch.outputs.branch_id }}
          DIRECT_DB_HOST: ${{ steps.create_neon_branch.outputs.db_host }}
        run: |
          set -euo pipefail
          if [ -n "${ORACLE_APP_PASSWORD:-}" ]; then echo "::add-mask::${ORACLE_APP_PASSWORD}"; fi
          if [ -n "${NEON_API_KEY:-}" ]; then echo "::add-mask::${NEON_API_KEY}"; fi
          if [ -n "${MIGRATION_DATABASE_URL:-}" ]; then echo "::add-mask::${MIGRATION_DATABASE_URL}"; fi

          if [ -z "${ORACLE_APP_PASSWORD:-}" ]; then
            echo "::error::Missing required GitHub secret ORACLE_APP_PASSWORD. Configure ORACLE_APP_PASSWORD in repository Actions secrets to run Neon preview branch migrations."
            exit 1
          fi

          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::Missing required GitHub secret NEON_API_KEY."
            exit 1
          fi

          if [ -z "${MIGRATION_DATABASE_URL:-}" ]; then
            echo "::error::Missing direct connection output (db_url) from neondatabase/create-branch-action."
            exit 1
          fi

          case "${EXPECTED_NEON_BRANCH}" in
            preview/pr-*) ;;
            *)
              echo "::error::Refusing to run migration: target branch '${EXPECTED_NEON_BRANCH}' is not an isolated PR preview/ branch."
              exit 1
              ;;
          esac

          if [ "${EXPECTED_NEON_BRANCH}" = "production" ] || [ "${EXPECTED_NEON_BRANCH}" = "main" ]; then
            echo "::error::Refusing to run migration against protected branch '${EXPECTED_NEON_BRANCH}'."
            exit 1
          fi

          if [ -z "${EXPECTED_NEON_BRANCH_ID:-}" ]; then
            echo "::error::Missing branch_id output from neondatabase/create-branch-action."
            exit 1
          fi

          case "${DIRECT_DB_HOST:-}" in
            *-pooler*)
              echo "::error::Refusing to run migration: db_host is a pooled endpoint (-pooler)."
              exit 1
              ;;
            ep-*.neon.tech|ep-*.neon.build) ;;
            *)
              echo "::error::Refusing to run migration: db_host is not a direct Neon compute endpoint (ep-...)."
              exit 1
              ;;
          esac

          unset DATABASE_URL
          npm run db:migrate -- \
            --expected-branch "${EXPECTED_NEON_BRANCH}" \
            --expected-branch-id "${EXPECTED_NEON_BRANCH_ID}"

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        id: delete_neon_branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
