name: PostgreSQL 16 & Protocol v1.10 CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

jobs:
  verify-and-test:
    name: Validate, Typecheck, Build & Real PostgreSQL 16 Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_ephemeral
          POSTGRES_DB: oracle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate historical demo archive
        run: npm run validate

      - name: Typecheck application, server, and audit configs
        run: npm run typecheck

      - name: Run unit and real PostgreSQL 16 integration tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres_ci_ephemeral@127.0.0.1:5432/oracle_ci
        run: npm test

      - name: Build production bundle
        run: npm run build
