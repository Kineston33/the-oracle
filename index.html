<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070C" />
    <meta
      name="description"
      content="THE ORACLE — See what's coming. Explore the future, discover emerging signals, and read a public archive of official predictions. One question. One official prediction. The same answer for everyone."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Canonical and indexing. The archive is a demonstration at v0.1, so it
         asks not to be indexed until the first official record set is live. -->
    <link rel="canonical" href="https://the-oracle.example/" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Icons and install metadata -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THE ORACLE" />
    <meta property="og:title" content="THE ORACLE — See what's coming." />
    <meta
      property="og:description"
      content="A public archive of official predictions. Explore the future, discover emerging signals, and read the record of what was forecast and what happened."
    />
    <meta property="og:url" content="https://the-oracle.example/" />
    <meta property="og:image" content="https://the-oracle.example/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A faceted violet crystal sphere orbited by two rings, beside the words: See what's coming."
    />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THE ORACLE — See what's coming." />
    <meta
      name="twitter:description"
      content="A public archive of official predictions. Explore the future and read the record of what was forecast and what happened."
    />
    <meta name="twitter:image" content="https://the-oracle.example/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="A faceted violet crystal sphere orbited by two rings, beside the words: See what's coming."
    />

    <title>THE ORACLE — See what's coming.</title>
    <script>
      document.documentElement.classList.remove('no-js');
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <noscript>
      <div class="noscript-fallback">
        <h1>THE ORACLE</h1>
        <p>See what's coming. THE ORACLE requires JavaScript to run its exploration interface.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
